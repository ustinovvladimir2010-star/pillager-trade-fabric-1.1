name: Build Pillager Trade Mod

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build mod
        run: gradle build

      - name: Check JAR
        run: |
          JAR=$(find build/libs -name '*.jar' ! -name '*-sources.jar' | head -n 1)
          test -n "$JAR"
          jar tf "$JAR" | grep -q '^fabric.mod.json$'
          echo "JAR успешно собран: $JAR"

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: pillager-trade-mod
          path: build/libs/*.jar
